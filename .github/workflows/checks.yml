name: schema-registry-ci
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        composer: ['--prefer-lowest', '--prefer-stable']
    name: PHP ${{ matrix.php }} ${{ matrix.composer }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
          ini-values: error_reporting=E_ALL
      - name: Install vendors
        run: composer update --no-interaction --no-progress --no-scripts ${{ matrix.composer }}
      - name: Run PHPUnit
        run: vendor/bin/phpunit --exclude-group integration

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: phpstan:1
      - name: Install vendors
        run: composer update --no-interaction --no-progress --no-scripts --prefer-stable
      - name: Run PHPStan analysis
        run: phpstan analyse --no-progress

  confluent-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        confluent: ['7.9.1', '5.5.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Install vendors
        run: composer update --no-interaction --no-progress --no-scripts --prefer-stable
      - name: Run PHPUnit Integration
        env:
          CONFLUENT_VERSION: ${{ matrix.confluent }}
        run: |
          chmod a+x bin/wait-for-all.sh bin/wait-for-it.sh
          make platform
          ENABLE_INTEGRATION_TEST=1 TEST_SCHEMA_REGISTRY_HOST=172.68.0.103 TEST_SCHEMA_REGISTRY_PORT=8081 \
            vendor/bin/phpunit --group integration
